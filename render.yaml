services:
  # Página inicial + relatórios do scanner
  - type: web
    name: tcc-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --timeout 120
    envVars:
      - key: ALVO_URL_VULNERAVEL
        value: https://tcc-app-vulneravel.onrender.com/login
      - key: ALVO_URL_SEGURA
        value: https://tcc-app-segura.onrender.com/login

  # Aplicação vulnerável (alvo dos testes)
  - type: web
    name: tcc-app-vulneravel
    runtime: python
    plan: free
    rootDir: arquivovulneravel
    buildCommand: pip install flask gunicorn
    startCommand: gunicorn app:app

  # Aplicação segura (versão corrigida)
  - type: web
    name: tcc-app-segura
    runtime: python
    plan: free
    rootDir: arquivoseguro
    buildCommand: pip install flask gunicorn bcrypt email-validator
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
