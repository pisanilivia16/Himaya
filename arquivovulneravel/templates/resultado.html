<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} — Sistema Vulnerável</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vermelho: #ff2a2a; --vermelho-esc: #8b0000; --verde: #2aff8f;
      --fundo: #0a0a0a; --painel: #110d0d; --borda: #3a1010;
      --texto: #e8d5d5; --texto-fraco: #7a5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--fundo);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rajdhani', sans-serif;
    }
    .painel {
      width: 380px; background: var(--painel); border: 1px solid var(--borda);
      border-top: 3px solid {{ 'var(--verde)' if sucesso else 'var(--vermelho)' }};
      padding: 40px 36px 36px; text-align: center;
      box-shadow: 0 0 40px rgba(255,42,42,0.12);
    }
    .icone {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px; font-size: 26px; font-family: 'Share Tech Mono', monospace;
      border: 1px solid {{ 'var(--verde)' if sucesso else 'var(--vermelho)' }};
      color: {{ 'var(--verde)' if sucesso else 'var(--vermelho)' }};
    }
    h1 {
      font-size: 20px; font-weight: 700; color: var(--texto);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
    }
    p.mensagem { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--texto-fraco); line-height: 1.7; margin-bottom: 28px; }
    a.botao {
      display: block; padding: 13px; border-radius: 4px; text-decoration: none;
      font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.15em;
      background: var(--vermelho-esc); border: 1px solid var(--vermelho); color: #fff;
    }
    a.botao:hover { background: var(--vermelho); }
    .rodape { margin-top: 22px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--texto-fraco); }
  </style>
</head>
<body>
  <div class="painel">
    <div class="icone">{{ '✓' if sucesso else '✕' }}</div>
    <h1>{{ titulo }}</h1>
    <p class="mensagem">{{ mensagem }}</p>

    {% if sucesso and mostrar_login %}
      <a class="botao" href="/">Ir para o login</a>
    {% elif not sucesso %}
      <a class="botao" href="{{ voltar_para }}">Tentar novamente</a>
    {% endif %}

    <p class="rodape">arquivovulneravel · Alvo dos testes</p>
  </div>
</body>
</html>
