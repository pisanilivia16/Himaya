<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Sistema Vulnerável</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vermelho:     #ff2a2a;
      --vermelho-esc: #8b0000;
      --fundo:        #0a0a0a;
      --painel:       #110d0d;
      --borda:        #3a1010;
      --texto:        #e8d5d5;
      --texto-fraco:  #7a5555;
      --input-bg:     #1a0f0f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--fundo);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rajdhani', sans-serif;
    }
    .painel {
      width: 380px; background: var(--painel);
      border: 1px solid var(--borda); border-top: 3px solid var(--vermelho);
      padding: 40px 36px 36px;
      box-shadow: 0 0 40px rgba(255,42,42,0.12);
    }
    .aviso-topo {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,42,42,0.08); border: 1px solid rgba(255,42,42,0.25);
      border-radius: 4px; padding: 8px 12px; margin-bottom: 28px;
      font-family: 'Share Tech Mono', monospace; font-size: 10px;
      color: var(--vermelho); letter-spacing: 0.05em;
    }
    .aviso-topo::before { content: '⚠'; font-size: 14px; }
    .cabecalho { text-align: center; margin-bottom: 32px; }
    .cabecalho h1 { font-size: 22px; font-weight: 700; color: var(--texto); letter-spacing: 0.1em; text-transform: uppercase; }
    .cabecalho .subtitulo { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--texto-fraco); margin-top: 6px; }
    .campo { margin-bottom: 18px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--texto-fraco); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
    input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--borda);
      border-radius: 4px; padding: 12px 14px; font-family: 'Share Tech Mono', monospace;
      font-size: 13px; color: var(--texto); outline: none;
    }
    input:focus { border-color: var(--vermelho); box-shadow: 0 0 0 3px rgba(255,42,42,0.1); }
    input::placeholder { color: #3a2020; }
    button {
      width: 100%; margin-top: 8px; padding: 14px; background: var(--vermelho-esc);
      border: 1px solid var(--vermelho); border-radius: 4px; font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
    }
    button:hover { background: var(--vermelho); box-shadow: 0 0 20px rgba(255,42,42,0.35); }
    .rodape { margin-top: 24px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--texto-fraco); }
    .rodape a { color: var(--vermelho); text-decoration: none; }
  </style>
</head>
<body>
  <div class="painel">

    <div class="aviso-topo">AMBIENTE VULNERÁVEL — APENAS PARA TESTES</div>

    <div class="cabecalho">
      <h1>Criar Conta</h1>
      <p class="subtitulo">arquivovulneravel · porta 5000</p>
    </div>

    <form action="/cadastro" method="post">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="escolha um usuário" autocomplete="off">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" placeholder="qualquer coisa aqui funciona" autocomplete="off">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="sem regras — tente '1'">
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <p class="rodape">Já tem conta? <a href="/">Entrar</a></p>
  </div>
</body>
</html>
