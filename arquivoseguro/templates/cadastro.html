<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Sistema Seguro</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #1a6cf5; --azul-esc: #0f4db5; --verde: #00c896;
      --fundo: #f0f4ff; --painel: #ffffff; --borda: #dce4f5;
      --texto: #0f1b33; --texto-fraco: #6b7fa3; --input-bg: #f7f9ff;
      --sombra: rgba(26,108,245,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--fundo);
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    .painel {
      width: 420px; background: var(--painel); border: 1px solid var(--borda);
      border-radius: 16px; padding: 44px 40px 40px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 60px var(--sombra);
    }
    .barra-seguranca {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,200,150,0.08); border: 1px solid rgba(0,200,150,0.25);
      border-radius: 8px; padding: 9px 14px; margin-bottom: 28px;
      font-family: 'DM Mono', monospace; font-size: 11px; color: #00a87a; font-weight: 500;
    }
    .barra-seguranca .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }
    .cabecalho { margin-bottom: 28px; }
    .cabecalho h1 { font-size: 24px; font-weight: 700; color: var(--texto); letter-spacing: -0.02em; }
    .cabecalho .subtitulo { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--texto-fraco); margin-top: 6px; }
    .campo { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--texto); margin-bottom: 8px; }
    input {
      width: 100%; background: var(--input-bg); border: 1.5px solid var(--borda);
      border-radius: 10px; padding: 13px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--texto); outline: none;
    }
    input:focus { border-color: var(--azul); background: #fff; box-shadow: 0 0 0 4px rgba(26,108,245,0.1); }
    input::placeholder { color: #c0cbe0; }
    .regras {
      background: var(--input-bg); border: 1px solid var(--borda); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 20px;
      font-family: 'DM Mono', monospace; font-size: 11px; color: var(--texto-fraco); line-height: 1.8;
    }
    .regras strong { color: var(--texto); }
    button {
      width: 100%; margin-top: 4px; padding: 14px; background: var(--azul);
      border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
      box-shadow: 0 4px 16px rgba(26,108,245,0.3);
    }
    button:hover { background: var(--azul-esc); box-shadow: 0 6px 24px rgba(26,108,245,0.4); }
    .rodape { margin-top: 20px; text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--texto-fraco); }
    .rodape a { color: var(--azul); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="painel">

    <div class="barra-seguranca">
      <span class="dot"></span>
      CONEXÃO SEGURA · validação completa ativa
    </div>

    <div class="cabecalho">
      <h1>Criar conta</h1>
      <p class="subtitulo">arquivoseguro · porta 5001</p>
    </div>

    <form action="/cadastro" method="post">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="escolha um usuário" autocomplete="username">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div class="regras">
        <strong>A senha precisa ter:</strong><br>
        • Mínimo de 8 caracteres<br>
        • 1 letra maiúscula e 1 minúscula<br>
        • 1 número<br>
        • 1 caractere especial (!@#$...)
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button type="submit">Criar conta com segurança</button>
    </form>

    <p class="rodape">Já tem conta? <a href="/">Entrar</a></p>
  </div>
</body>
</html>
